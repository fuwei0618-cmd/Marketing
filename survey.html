<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>行銷方向問卷</title>
<style>
:root{--ink:#16416c;--bg:#fdf9ee;--card:#fff;--hl:#c9dbef;--mute:#5b6b7c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:24px;margin:4px 0}p.lead{color:var(--mute);margin:0 0 18px;font-size:15px}
h2{font-size:18px;margin:28px 0 8px;padding-top:8px;border-top:2px solid var(--hl)}
.q{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.q .t{font-weight:700;margin-bottom:8px}.q .t small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:inherit;font-size:15px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.opts button[aria-pressed=true]{background:var(--ink);color:#fff}
textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid #ccd;border-radius:12px;padding:10px;min-height:70px;margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid #e5ddc8;padding:12px 16px}
.bar div{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar button{flex:1;font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;background:#06c755;color:#fff;cursor:pointer}
.bar span{font-size:14px;color:var(--mute);white-space:nowrap}
</style></head><body><main>
<h1>行銷方向問卷</h1>
<p class="lead">點選就好，大約 5 分鐘。沒有標準答案，選最直覺的就好。填完按最下面綠色按鈕，用 LINE 傳回給我。之後的活動都會照這份答案來規劃。</p>
<div id="f"></div>
</main>
<div class="bar"><div><span id="cnt"></span><button id="send">用 LINE 傳給 fuwei</button></div></div>
<script>
const A=[
 ["先想一想",[
  ["p1","三個月後，如果只能看到一個改變，您最希望是什麼？",null,["客人變多","LINE 好友變多","營業額明顯成長","客人記得我們的品牌","店員比較輕鬆"]],
  ["p2","您心中「有意義的活動」比較像哪一種？","可選 2 個",["數字有成長","客人會記得、會再來","店員也覺得有感","有話題、有人分享","不用花大錢"],2],
  ["p3","如果行銷交給我主導一個月，您最擔心的是？","可選 2 個",["花了錢沒效果","影響店的形象","增加店員工作","跟原本做法差太多","不知道進度"],2],
  ["p4","到 12 月底，看到什麼結果您會覺得「這錢花得值得」？",null,null]]],
 ["整體方向",[
  ["g1","接下來 3 個月，行銷最重要的目標是？","可選 2 個",["營業額成長","LINE 好友變多","新客人變多","老客人常回來","品牌知名度"],2],
  ["g2","全部門市加起來，每月行銷花費上限大約？","讓利＋印刷＋廣告",["3,000 以內","3,000–10,000","1–3 萬","有成效再加碼"]],
  ["g3","哪些事我可以自己決定、做完再跟您報告？",null,["不花錢的事（文案、貼文、排程）","每次 1,000 元以內","每次 3,000 元以內","全部都先問我"]],
  ["g4","您希望多久跟您回報一次？",null,["每週 LINE 三行週報","每兩週電話一次","每月開會一次","有事再說"]],
  ["g5","您怎麼判斷我這個月做得好？","可選 2 個",["營業額","LINE 好友數","活動兌換份數","事情推進速度","店員回饋"],2]]],
 ["各品牌：最想解決什麼？",[
  ["b1","拾串・哨帥（龍安）",null,["新客少","老客不常回來","某些時段很冷","客單價低","維持現狀就好"]],
  ["b2","三顧茅廬滷味（中平・寶山）",null,["新客少","老客不常回來","某些時段很冷","客單價低","維持現狀就好"]],
  ["b3","李氏豆腐鍋（壽昌）",null,["新客少","老客不常回來","某些時段很冷","客單價低","維持現狀就好"]],
  ["b4","一口煎餃（龍安）",null,["新客少","老客不常回來","某些時段很冷","客單價低","維持現狀就好"]],
  ["b5","紅茶大苑（國鼎・壽昌・龍安）",null,["新客少","老客不常回來","某些時段很冷","客單價低","維持現狀就好"]],
  ["b6","韓殿・拾串（寶山）",null,["新客少","老客不常回來","某些時段很冷","客單價低","維持現狀就好"]]]],
 ["活動規則",[
  ["r1","一家店一個月最多可以讓利多少？","送小菜、折價券等",["1,000 以內","1,000–3,000","3,000–5,000","看活動再說"]],
  ["r2","一個新活動要試多久再檢討？",null,["2 週","1 個月","2 個月"]],
  ["r3","哪些東西不能拿來送或折？","例如招牌品項、某些飲料",null],
  ["r4","還有什麼想跟我說的？",null,null]]]];
const ans={};
const f=document.getElementById("f");
f.innerHTML=A.map(([sec,qs])=>`<h2>${sec}</h2>`+qs.map(([id,t,sub,opts,max])=>`<div class="q"><div class="t">${t}${sub?`<small>${sub}</small>`:""}</div>${opts?`<div class="opts" data-q="${id}" data-max="${max||1}">${opts.map(o=>`<button type="button" aria-pressed="false">${o}</button>`).join("")}</div>`:`<textarea data-q="${id}" placeholder="可以不填"></textarea>`}</div>`).join("")).join("");
f.querySelectorAll(".opts").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{const max=+g.dataset.max,on=b.getAttribute("aria-pressed")==="true";
 if(max===1)g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
 else if(!on&&g.querySelectorAll("[aria-pressed=true]").length>=max)return;
 b.setAttribute("aria-pressed",String(!on));ans[g.dataset.q]=[...g.querySelectorAll("[aria-pressed=true]")].map(x=>x.textContent);upd()}));
f.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{ans[t.dataset.q]=t.value.trim()?[t.value.trim()]:[];upd()});
const total=A.reduce((n,[,q])=>n+q.filter(x=>x[3]).length,0);
function upd(){const n=A.flatMap(([,q])=>q).filter(x=>x[3]&&(ans[x[0]]||[]).length).length;document.getElementById("cnt").textContent=`已選 ${n}/${total}`}upd();
document.getElementById("send").onclick=()=>{let i=0;const txt="【行銷方向問卷】\n"+A.map(([sec,qs])=>`\n■ ${sec}\n`+qs.map(([id,t])=>`${++i}. ${t}\n→ ${(ans[id]||[]).join("、")||"（未填）"}`).join("\n")).join("\n");
 location.href="https://line.me/R/share?text="+encodeURIComponent(txt)};
</script></body></html>
