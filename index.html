<style>
/* Layout: top bar with goal meter, horizontal tab rail, one working panel per module */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --line:#dfe5e2; --fg:#1c2622; --muted:#5f6d67;
  --accent:#9a4a12; --accent-soft:#f6e7da; --tea:#2f5d4f; --tea-soft:#e2eeea;
  --ok:#2e7d4f; --warn:#b7791f; --bad:#b4372f; --ok-soft:#e3f2e8; --warn-soft:#fbf0dc; --bad-soft:#f8e3e1;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1c2421; --line:#2c3632; --fg:#e6ece9; --muted:#9aa8a2;
  --accent:#e09356; --accent-soft:#3a2a1d; --tea:#7fbfa9; --tea-soft:#1f322c;
  --ok:#6cc391; --warn:#e3b35a; --bad:#ec7b72; --ok-soft:#1d3326; --warn-soft:#382e1a; --bad-soft:#3a2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1c2421; --line:#2c3632; --fg:#e6ece9; --muted:#9aa8a2;
  --accent:#e09356; --accent-soft:#3a2a1d; --tea:#7fbfa9; --tea-soft:#1f322c;
  --ok:#6cc391; --warn:#e3b35a; --bad:#ec7b72; --ok-soft:#1d3326; --warn-soft:#382e1a; --bad-soft:#3a2220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand h1{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0;flex:0 1 340px}
.goal .lbl{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.goal .num{font-family:var(--mono);font-size:1.4rem;font-weight:600;color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:18px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{margin-top:20px;display:grid;gap:18px}
h2{font-size:1.15rem;margin:0;font-weight:700}
h3{font-size:.95rem;margin:0 0 8px;font-weight:700}
.hint{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.today li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.today li:first-child{border-top:0}
ul{list-style:none;margin:0;padding:0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-tea{background:var(--tea-soft);color:var(--tea)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em;white-space:nowrap}
td.c,th.c{text-align:center}
.chk{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:900;color:var(--surface)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"✓"}
.cell{min-width:34px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;font-weight:700;font-size:.8rem;padding:0 6px}
.cell.s0{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.cell.s1{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.s2{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.s3{color:var(--muted)}
th.grp{text-align:center;border-bottom:2px solid var(--tea);color:var(--tea);font-size:.8rem}
th.sep,td.sep{border-left:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;background:var(--surface);color:var(--muted);border:0;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tea);color:var(--surface);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;align-items:center}
.storecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.todo li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.todo li:first-child{border-top:0}
.todo li.done span.tx{text-decoration:line-through;color:var(--muted)}
.todo input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--ok)}
.todo .tx{flex:1;min-width:0}
.ask li{padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.ask li:first-child{border-top:0}
tr.brandrow td{background:var(--tea-soft);color:var(--tea);font-weight:700;font-size:.85rem;padding:6px 10px}
.brandhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 -4px}
.brandhead h3{margin:0;color:var(--tea)}
.chip{font:inherit;font-size:.78rem;border-radius:999px;padding:3px 10px;cursor:pointer;border:1px solid var(--tea);background:var(--tea-soft);color:var(--tea)}
.chip.off{background:none;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.camp{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.camp:first-of-type{border-top:0}
.camp .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ask-in{width:100%;min-width:160px}
.agenda{display:grid;gap:14px}
.ag-sec h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.ag-sec h3 .note{font-weight:400}
.ag-item{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ag-item:first-of-type{border-top:0}
.ag-item input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.ag-item label{font-weight:500;cursor:pointer}
.ag-item.done label{color:var(--muted);text-decoration:line-through}
.ag-item.done .ag-note{border-color:var(--ok)}
.ag-item .sub{font-size:.8rem;color:var(--muted);font-weight:400}
.ag-item .ag-note{grid-column:3;width:100%;font-size:.88rem;padding:5px 8px}
.progress{font-family:var(--mono);font-size:.85rem;color:var(--tea)}
a.lnk{color:var(--tea);font-weight:700;text-decoration:none;border-bottom:1px solid var(--tea)}
a.lnk:hover{opacity:.8}
.linkbar{display:flex;flex-wrap:wrap;gap:8px}
a.lbtn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--tea);background:var(--tea-soft);border-radius:7px;padding:6px 12px;text-decoration:none}
.gtab{grid-column:1/-1;margin-top:6px}
.gtab table{font-size:.75rem}
.gtab th,.gtab td{padding:4px 6px}
.gtab td.nx{color:var(--muted)}
tfoot td{font-size:.75rem;font-weight:700;color:var(--tea);background:var(--tea-soft);border-bottom:0}
td.cnt{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.chip.off2{background:none;border-color:var(--line);color:var(--muted)}
details.card summary::-webkit-details-marker{color:var(--muted)}
.info-t{font-size:.8rem}.info-t th,.info-t td{padding:5px 6px}
.iflag{color:var(--bad);font-size:.72rem;line-height:1.35;margin-top:2px;max-width:16em}
.infost{border:0;background:none;padding:0;cursor:pointer;font:inherit}
.todo2 li{display:flex;gap:8px;align-items:center;padding:3px 0;border-top:1px solid var(--line);font-size:.82rem;line-height:1.4}
.todo2 li:first-child{border-top:0}
.todo2 li.done .tx{text-decoration:line-through;color:var(--muted)}
.todo2 input[type=checkbox]{width:16px;height:16px;flex:0 0 auto;accent-color:var(--ok)}
.todo2 .tx{flex:1;min-width:0}
.todo2 .who{color:var(--muted);font-size:.74rem;white-space:nowrap}
.todo2 .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px}
.gh{font-size:.78rem;font-weight:700;color:var(--tea);padding:8px 0 2px;border-top:0}
.store-name b{display:block}
.store-name span{font-size:.78rem;color:var(--muted)}
.num-in{width:96px;font-family:var(--mono);text-align:right}
input,select,textarea{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
form.add{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form.add input,form.add select{flex:1 1 140px}
.btn{font:inherit;font-weight:700;background:var(--tea);color:var(--surface);border:0;border-radius:7px;padding:8px 14px;cursor:pointer}
.btn.ghost{white-space:nowrap;background:none;color:var(--muted);border:1px solid var(--line);font-weight:500;padding:4px 10px;font-size:.8rem}
.status{cursor:pointer;border:0;font:inherit}
.week{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .d{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.day .b{font-weight:700;margin:4px 0 2px;font-size:.92rem}
.day .t{font-size:.8rem;color:var(--muted);min-height:2.4em}
.formula{font-family:var(--mono);font-size:.95rem;background:var(--tea-soft);color:var(--tea);padding:10px 12px;border-radius:8px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--mono);font-size:1.5rem;font-weight:600}
.kpi .k{font-size:.78rem;color:var(--muted)}
.tabnum{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.empty{color:var(--muted);font-size:.88rem;padding:10px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.flow span.step{background:var(--tea-soft);color:var(--tea);padding:4px 10px;border-radius:6px;font-weight:500}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* compact pass */
table.tight td,table.tight th{padding:2px 7px}
table.tight tr.brandrow td{padding:3px 8px}
table.tight .num-in{height:22px}
.num-in{padding:2px 6px}
td .num-in{height:24px}
.ag-sec h3{margin-bottom:0}

body{font-size:14px;line-height:1.45}
.wrap{padding-block:10px 32px}
header.top{gap:10px;align-items:center}
.brand h1{font-size:1.25rem}

.goal{padding:6px 12px;flex-basis:300px}

.goal .note{font-size:.72rem}

nav.tabs{margin-top:8px}

section.panel{margin-top:10px;gap:10px}
h2{font-size:1.02rem}
h3{font-size:.88rem;margin-bottom:4px}
.hint{font-size:.78rem}
.card{padding:10px 12px;border-radius:8px}

.today li{padding:4px 0;font-size:.85rem}

th{font-size:.7rem}

.num-in{width:80px}
.btn{padding:5px 11px;font-size:.85rem}
.btn.ghost{padding:2px 8px;font-size:.76rem}
.chip{padding:2px 9px;font-size:.74rem}
.pill{font-size:.68rem;padding:1px 7px}
.seg button{padding:5px 11px;font-size:.84rem}
.kpi .v{font-size:1.15rem}
.formula{padding:6px 10px;font-size:.85rem}
.camp{padding:7px 0;gap:4px}
.todo li{padding:3px 0;font-size:.82rem}

.ag-item .ag-note{padding:3px 7px;font-size:.8rem}
.brandhead{margin:2px 0 -2px}
tr.brandrow td{padding:4px 8px;font-size:.8rem}
.legend{gap:6px;font-size:.75rem}

a.lbtn{padding:4px 10px;font-size:.78rem}

form.add{gap:6px}

</style>

  return listModule("service","客服紀錄","只記門市沒即時回覆的訊息。有紀錄，事後問起來查得到。",rows,["日期","門市","訊息摘要"],
   `<select id="s-store" name="store" required>${storeOpts}</select><input id="s-msg" name="msg" placeholder="顧客問了什麼" required>`);
}

function video(){
  const t=new Date(today()+"T00:00");const start=new Date(t);start.setDate(t.getDate()-t.getDay()+1);if(t.getDay()===0)start.setDate(start.getDate()-7);
  const weeks=[0,1].map(w=>[...Array(7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+w*7+i);return iso(d)}));
  const posted=Object.values(S.videos).filter(x=>x.status==="已發").length;
  const day=d=>{const v=videoFor(d);const wd="日一二三四五六"[new Date(d+"T00:00").getDay()];return `<div class="day ${d===today()?"is-today":""}"><div class="d">週${wd}・${fmtD(d)}</div><div class="b">${esc(v.brand)}</div><div class="t">${esc(v.topic)}</div>${statusBtn("video",d,v.status)}</div>`};
  return `<section class="panel"><div><h2>短影音專區</h2><p class="hint">一天一支：7 個品牌剛好一週輪一輪。已發 ${posted} 支。點狀態切換：未拍 → 已拍 → 已剪 → 已發。</p></div>
   <div class="card"><h3>本週與下週</h3><div class="scroll"><div class="week">${weeks[0].map(day).join("")}</div></div>
   <div class="scroll" style="margin-top:8px"><div class="week">${weeks[1].map(day).join("")}</div></div></div>
   <div class="grid2">
    <div class="card"><h3>批次拍攝，不要每天拍</h3><ul class="today">
     <li><span class="pill p-tea">跑店日</span><span>同一區一次拍完：龍安（紅茶、拾串、少帥、煎餃）、寶山（滷味、拾串、炒泡麵）、中平（滷味）、壽昌（紅茶、豆腐鍋）</span></li>
     <li><span class="pill p-tea">每店</span><span>一次拍 4–6 段素材：製程、近鏡、上桌、門面、活動 POP</span></li>
     <li><span class="pill p-tea">發片</span><span>同一支片發 IG Reels、TikTok、YouTube Shorts，再用 LINE 推一次</span></li></ul></div>
    <div class="card"><h3>修改某一天的主題</h3><form class="add" data-form="videoEdit">
     <input id="v-date" name="date" type="date" required aria-label="日期"><select id="v-brand" name="brand">${brandOpts}</select><input id="v-topic" name="topic" placeholder="主題（例：開幕倒數）"><button class="btn" type="submit">更新</button></form>
     <p class="note" style="margin-top:8px">預設輪替：週一紅茶、週二滷味、週三麻辣拌、週四拾串關東煮、週五煎餃、週六豆腐鍋、週日炒泡麵。</p></div>
   </div></section>`;
}

let growG="品牌";
function growth(){
  const lineOf=(k,m)=>n(((S.lineM||{})[k]||{})[m]);
  const lm=revMonths(), lk=lm.slice(1).reverse().find(m=>LINE_ACCS.some(k=>lineOf(k,m)));
  const tot=m=>LINE_ACCS.reduce((a,k)=>a+lineOf(k,m),0);
  return `<section class="panel"><div><h2>成長</h2><p class="hint">兩個數字：營業額 +20%，以及 LINE 會員數。都是每月記一次，跟 10 月比。</p></div>
  <div class="card"><div class="brandhead" style="margin:0 0 6px"><h3>LINE 會員數</h3><span class="note">LINE@ 目的：增加會員數、推活動｜每月月初記一次</span></div>
   <div class="scroll"><table class="tight"><thead><tr><th>帳號</th>${lm.map(m=>`<th class="c">${+m.slice(5)} 月${m==="2026-10"?"（基準）":""}</th>`).join("")}<th class="c">增加</th></tr></thead><tbody>
   ${LINE_ACCS.map((k,i)=>{const b=lineOf(k,"2026-10"),c=lk?lineOf(k,lk):0,d=b&&c?c-b:null;return `<tr><td>${esc(k)}</td>${lm.map(m=>`<td class="c"><input id="lm-${i}-${m}" class="num-in" inputmode="numeric" placeholder="—" value="${esc(((S.lineM||{})[k]||{})[m]||"")}" data-lm="${esc(k)}|${m}"></td>`).join("")}<td class="c tabnum">${d==null?'<span class="note">—</span>':`<span class="pill ${d>0?"p-ok":"p-warn"}">${d>0?"+":""}${d}</span>`}</td></tr>`}).join("")}
   </tbody><tfoot><tr><td>合計</td>${lm.map(m=>`<td class="c">${tot(m)||"—"}</td>`).join("")}<td class="c">${lk&&tot("2026-10")?((tot(lk)-tot("2026-10"))>0?"+":"")+(tot(lk)-tot("2026-10")):"—"}</td></tr></tfoot></table></div>
   <p class="note" style="margin-top:4px">10 月是 10/14 從 LINE 後台帳號列表抄的。</p></div>
  <div class="card"><div class="brandhead" style="margin:0 0 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center"><h3>營業額</h3><span class="note">10 月＝基準；每月月初填上個月</span><span style="display:inline-flex;gap:6px;align-items:center;margin-left:auto"><span class="note">分組</span>${["品牌","區域","狀態"].map(v=>`<button class="chip ${growG===v?"":"off2"}" data-gg="${v}">${v}</button>`).join("")}</span></div>
  <div class="scroll"><table class="tight"><thead><tr><th>門市</th>${revMonths().map(k=>`<th class="c">${+k.slice(5)} 月${k==="2026-10"?"（基準）":""}</th>`).join("")}<th class="c">最新 vs 10 月</th></tr></thead><tbody>
  ${(()=>{const lkOf=s=>revMonths().slice(1).reverse().find(k=>revOf(s.id,k));
    const gOf=s=>{const b=revOf(s.id,"2026-10"),lk=lkOf(s),c=lk?revOf(s.id,lk):0;return b&&c?(c/b-1)*100:null};
    const stat=s=>{const g=gOf(s);return g==null?"還沒資料":g>=20?"達標 +20%":g>=0?"成長中":"衰退"};
    const kf=growG==="品牌"?s=>s.brand:growG==="區域"?region:stat;
    const ord=growG==="品牌"?BRANDS.map(g=>g.b):growG==="區域"?REGIONS:["衰退","成長中","達標 +20%","還沒資料"];
    const pill=g=>g==null?'<span class="note">—</span>':`<span class="pill ${g>=20?"p-ok":g>=0?"p-warn":"p-bad"}">${(g>=0?"+":"")+g.toFixed(1)}%</span>`;
    return ord.map(k=>{const list=S.stores.filter(s=>kf(s)===k);if(!list.length)return "";
      const sumB=list.reduce((a,s)=>a+revOf(s.id,"2026-10"),0),both=list.filter(s=>revOf(s.id,"2026-10")&&lkOf(s));
      const gg=both.length?(both.reduce((a,s)=>a+revOf(s.id,lkOf(s)),0)/both.reduce((a,s)=>a+revOf(s.id,"2026-10"),0)-1)*100:null;
      return `<tr class="brandrow"><td colspan="${revMonths().length+1}">${esc(k)}${sumB?` <span class="note" style="font-weight:400">10 月合計 ${sumB.toLocaleString()}</span>`:""}</td><td class="c">${list.length>1?pill(gg):""}</td></tr>`+
      list.map(s=>{const i=S.stores.indexOf(s);const nm=growG==="品牌"?s.branch.replace("店",""):s.brand.replace("滷味","").replace("麻辣拌","").replace("關東煮","")+" "+s.branch.replace("店","");
        return `<tr><td style="white-space:nowrap">${esc(nm)}</td>${revMonths().map(k2=>`<td class="c"><input id="rv-${i}-${k2}" class="num-in" inputmode="numeric" placeholder="—" value="${esc(((S.rev||{})[s.id]||{})[k2]||"")}" data-rv="${esc(s.id)}|${k2}"></td>`).join("")}<td class="c">${pill(gOf(s))}</td></tr>`}).join("")}).join("")})()}
  </tbody></table></div>
  <p class="note" style="margin-top:6px">每個月都會留一欄，前面的月份會一直保存。飲料冬天會淡，也可以跟哥哥要去年同月份的數字，比較公平。</p></div>
  </section>`;
}

function vault(){
  return `<div class="grid3">${[["Google 商家",`<a class="lnk" href="${LINKS.gbp}" target="_blank" rel="noopener">business.google.com/locations</a>`,"全部門市清單；看不到就切「要求桌面版網站」"],["LINE 官方帳號",`<a class="lnk" href="${LINKS.line}" target="_blank" rel="noopener">manager.line.biz</a>`,"各店 OA 後台"],["肚肚後台（雲端點餐）",`<a class="lnk" href="${LINKS.dudoo}" target="_blank" rel="noopener">admin.dudooeat.com</a>`,"O2O 管理 → 線上點餐設定。帳密放密碼管理器"],["LINE Pay QR Code","老闆提供檔案","獨資 5 間共用同一格式，尺寸待確認"],["店長 曹大哥","已加 LINE","門市聯絡不到時通報"],["印刷廠商","待確認","布條、海報、菜單牌、立牌"]].map(([a,b,c])=>`<div class="card"><h3>${a}</h3><div class="tabnum" style="font-size:.85rem">${b}</div><p class="note">${c}</p></div>`).join("")}</div>
  <div class="card"><h3>肚肚訂餐連結（LINE）</h3><ul class="todo">${Object.entries(ORDER_LINKS).filter(([id])=>id!=="韓殿炒泡麵-寶山店").map(([id,l])=>`<li><span class="tx">${esc(ORDER_LABEL[id]||id.replace("-"," "))}</span><button class="btn ghost" data-copy="${esc(l)}">複製</button></li>`).join("")}</ul></div>
  <p class="note">密碼不要寫在這裡，放 iPad「密碼」App 或密碼管理器。</p>`;
}
function backup(){
  return `<div class="card"><h3>匯出</h3><p class="note">資料存在這台裝置的瀏覽器裡。換裝置、換網址前，先複製這段備份碼，貼到新的地方「匯入」。</p>
   <textarea id="bk-out" readonly style="width:100%;min-height:90px;font-size:.75rem">${esc(JSON.stringify(S))}</textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn" id="bkCopy">複製備份碼</button><span id="bkOk" class="note"></span></div></div>
  <div class="card"><h3>匯入</h3><p class="note">貼上備份碼後按匯入，會取代這台裝置目前的資料。</p>
   <textarea id="bk-in" style="width:100%;min-height:90px;font-size:.75rem" placeholder="貼上備份碼"></textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn" id="bkImport">匯入</button><span id="bkMsg" class="note"></span></div></div>
  <div class="card"><h3>重設</h3><button class="btn ghost" id="reset">清空並回到預設資料</button> <span id="resetConfirm"></span></div>`;
}
function more(){
  const opts=[["meeting","開會紀錄"],["service","客服紀錄"],["vault","帳號連結"],["backup","備份"]];
  const seg=`<div class="seg" role="group" aria-label="切換">${opts.map(([k,l])=>`<button data-mv="${k}" aria-pressed="${moreView===k}">${l}</button>`).join("")}</div>`;
  const body=moreView==="meeting"?meeting():moreView==="service"?service():moreView==="vault"?`<section class="panel"><div><h2>帳號連結</h2></div>${vault()}</section>`:`<section class="panel"><div><h2>備份</h2></div>${backup()}</section>`;
  return `<div style="margin-top:20px">${seg}</div>${body}`;
}

const VIEWS={home,stores,info,campaign,material,video,growth,more};
function render(){$("#main").innerHTML=VIEWS[tab]();bind()}
function bind(){
  document.querySelectorAll(".cell[data-k]").forEach(b=>b.onclick=()=>{const s=S.stores[b.dataset.i];s.st[b.dataset.k]=((s.st[b.dataset.k]||0)+1)%4;save();render()});
  document.querySelectorAll("[data-ask]").forEach(i=>i.onchange=()=>{S.stores[i.dataset.ask].ask=i.value.trim();save();render()});
  document.querySelectorAll("[data-cid]").forEach(b=>b.onclick=()=>{const c=S.campaigns.find(x=>String(x.id)===b.dataset.cid);c.exclude=c.exclude||[];const k=b.dataset.sid;c.exclude=c.exclude.includes(k)?c.exclude.filter(x=>x!==k):[...c.exclude,k];save();render()});
  document.querySelectorAll("[data-tweak]").forEach(i=>i.onchange=()=>{S.campaigns.find(x=>String(x.id)===i.dataset.tweak).tweak=i.value.trim();save()});
  document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{const c=S.campaigns.find(x=>String(x.id)===b.dataset.dup);S.campaigns.push({...c,id:Date.now(),title:c.title+"（複製）",status:"規劃中",exclude:[...(c.exclude||[])]});save();render()});
  document.querySelectorAll("[data-ag]").forEach(c=>c.onchange=()=>{const k=c.dataset.ag;S.meeting[k]={...(S.meeting[k]||{}),done:c.checked};save();render()});
  document.querySelectorAll("[data-agn]").forEach(t=>t.onchange=()=>{const k=t.dataset.agn;S.meeting[k]={...(S.meeting[k]||{}),note:t.value};save()});
  const ax=document.querySelector("[data-agx]");if(ax)ax.onchange=()=>{S.meeting._extra=ax.value;save()};
  const ar=$("#agReset");if(ar)ar.onclick=()=>{$("#agConfirm").innerHTML=`確定清空？ <button class="btn ghost" id="agYes">確定</button>`;$("#agYes").onclick=()=>{S.meeting={};save();render()}};
  document.querySelectorAll("[data-mo]").forEach(c=>c.onchange=()=>{monthState(ym()).order[c.dataset.mo]=c.checked;save();render()});
  document.querySelectorAll("[data-mp]").forEach(c=>c.onchange=()=>{monthState(nextYm()).push[c.dataset.mp]=c.checked;save();render()});
  document.querySelectorAll("[data-msgacc]").forEach(t=>t.onchange=()=>{const m=monthState(nextYm());m.msgs=m.msgs||{};m.msgs[t.dataset.msgacc]=t.value;save()});
  document.querySelectorAll("[data-copymsg]").forEach(b=>b.onclick=()=>{const i=b.dataset.copymsg,t=$("#rt-msg-"+i);navigator.clipboard.writeText(t.value).then(()=>{$("#copyOk-"+i).textContent="已複製"},()=>{t.select();$("#copyOk-"+i).textContent="已選取，請長按複製"})});
  document.querySelectorAll("[data-resetmsg]").forEach(b=>b.onclick=()=>{const m=monthState(nextYm());if(m.msgs)delete m.msgs[b.dataset.resetmsg];save();render()});
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent="已複製"},()=>{b.textContent="複製失敗"})});
  document.querySelectorAll("[data-lm]").forEach(i=>i.onchange=()=>{const [k,m]=i.dataset.lm.split("|");S.lineM=S.lineM||{};(S.lineM[k]=S.lineM[k]||{})[m]=i.value.trim();save();render()});
  document.querySelectorAll("[data-infost]").forEach(b=>b.onclick=()=>{S.info=S.info||{};const m=S.info[b.dataset.infost]=S.info[b.dataset.infost]||{};m.st=INFO_ST[(INFO_ST.indexOf(m.st||"待確認")+1)%3];save();render()});
  document.querySelectorAll("[data-infofix]").forEach(i=>i.onchange=()=>{S.info=S.info||{};(S.info[i.dataset.infofix]=S.info[i.dataset.infofix]||{}).fix=i.value.trim();save()});
  document.querySelectorAll("[data-infocopy]").forEach(b=>b.onclick=()=>{const t=infoText(b.dataset.infocopy.split(","));navigator.clipboard.writeText(t).then(()=>{b.textContent="已複製"},()=>{b.textContent="複製失敗"})});
  document.querySelectorAll("[data-ig]").forEach(b=>b.onclick=()=>{infoG=b.dataset.ig;render()});
  document.querySelectorAll("[data-gg]").forEach(b=>b.onclick=()=>{growG=b.dataset.gg;render()});
  document.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{campV=b.dataset.cv;render()});
  document.querySelectorAll("[data-cg]").forEach(b=>b.onclick=()=>{campG=b.dataset.cg;render()});
  document.querySelectorAll("[data-tc]").forEach(b=>b.onclick=()=>{todoCat=b.dataset.tc;render()});
  document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{todoGroup=b.dataset.tg;render()});
  const tdd=$("#tdDone");if(tdd)tdd.onclick=()=>{todoDone=!todoDone;render()};
  document.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{accV=b.dataset.av;render()});
  document.querySelectorAll("[data-ag2]").forEach(b=>b.onclick=()=>{accG=b.dataset.ag2;render()});
  document.querySelectorAll("[data-al2]").forEach(b=>b.onclick=()=>{accL=b.dataset.al2;render()});
  document.querySelectorAll("[data-rv]").forEach(i=>i.onchange=()=>{const [id,k]=i.dataset.rv.split("|");S.rev=S.rev||{};(S.rev[id]=S.rev[id]||{})[k]=i.value.trim();save();render()});
  document.querySelectorAll("[data-mplan]").forEach(i=>i.onchange=()=>{monthState(i.dataset.mplan).plan=i.value.trim();save()});
  document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{storeView=b.dataset.sv;try{localStorage.setItem(KEY+"-sv",storeView)}catch(e){}render()});
  document.querySelectorAll("[data-ti]").forEach(c=>c.onchange=()=>{S.stores[c.dataset.ti].todos[c.dataset.tj].done=c.checked;save();render()});
  document.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{S.stores[b.dataset.tdel].todos.splice(b.dataset.tj,1);save();render()});
  document.querySelectorAll("[data-lb]").forEach(i=>i.onchange=()=>{(S.line[i.dataset.lb]=S.line[i.dataset.lb]||{}).base=i.value.trim();save();render()});
  document.querySelectorAll("[data-ln]").forEach(i=>i.onchange=()=>{(S.line[i.dataset.ln]=S.line[i.dataset.ln]||{}).now=i.value.trim();save();render()});
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{moreView=b.dataset.mv;try{localStorage.setItem(KEY+"-mv",moreView)}catch(e){}render()});
  const bc=$("#bkCopy");if(bc)bc.onclick=()=>{const t=$("#bk-out").value;navigator.clipboard.writeText(t).then(()=>{$("#bkOk").textContent="已複製"},()=>{$("#bk-out").select();$("#bkOk").textContent="已選取，請長按複製"})};
  const bi=$("#bkImport");if(bi)bi.onclick=()=>{try{const d=JSON.parse($("#bk-in").value);if(!d.stores)throw 0;S=d;save();$("#bkMsg").textContent="已匯入";render()}catch(e){$("#bkMsg").textContent="備份碼格式不對，請重新複製完整的一段"}};
  document.querySelectorAll("[data-base]").forEach(i=>i.onchange=()=>{S.stores[i.dataset.base].base=i.value.trim();save();render()});
  document.querySelectorAll("[data-now]").forEach(i=>i.onchange=()=>{S.stores[i.dataset.now].now=i.value.trim();save();render()});
  document.querySelectorAll(".status").forEach(b=>b.onclick=()=>{const {type,id}=b.dataset;
    if(type==="video"){const v=videoFor(id);S.videos[id]={...(S.videos[id]||{}),status:next("video",v.status)}}
    else{const it=S[type].find(x=>String(x.id)===id);it.status=next(type==="campaigns"?"campaign":type==="materials"?"material":"service",it.status)}
    save();render()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S[b.dataset.del]=S[b.dataset.del].filter(x=>String(x.id)!==b.dataset.id);save();render()});
  document.querySelectorAll("form[data-form]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const id=Date.now();
    if(f.dataset.form==="campaigns")S.campaigns.push({id,...d,status:"規劃中"});
    if(f.dataset.form==="materials")S.materials.push({id,...d,status:"待下單"});
    if(f.dataset.form==="service")S.service.push({id,...d,date:today(),status:"待門市回覆"});
    if(f.dataset.form==="todo"){const t={cat:d.cat,text:d.text,done:false};(d.store==="all"?S.stores:[S.stores[d.store]]).forEach(s=>s.todos.push({...t}))}
    if(f.dataset.form==="videoEdit"){const cur=S.videos[d.date]||{};S.videos[d.date]={...cur,...(d.brand&&d.brand!=="全品牌"?{brand:d.brand}:{}),...(d.topic?{topic:d.topic}:{})}}
    save();render()});
  const r=$("#reset");if(r)r.onclick=()=>{$("#resetConfirm").innerHTML=`確定清空？ <button class="btn ghost" id="yes">確定</button>`;$("#yes").onclick=()=>{S=seed();save();render()}};
}
