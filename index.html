function renderGoal(){
  const base=S.stores.reduce((a,s)=>a+n(s.base),0), now=S.stores.reduce((a,s)=>a+n(s.now),0);
  if(!base){$("#goalNum").textContent="尚未設定基準";$("#goalBar").style.width="0%";$("#goalNote").textContent="到「成長」填入各店基準營業額後開始計算";return}
  const g=(now/base-1)*100, pct=Math.max(0,Math.min(100,g/20*100));
  $("#goalNum").textContent=(g>=0?"+":"")+g.toFixed(1)+"%";
  $("#goalBar").style.width=pct+"%";
  $("#goalNote").textContent=`目標 +20%｜已完成 ${pct.toFixed(0)}%｜基準 ${base.toLocaleString()} → 本月 ${now.toLocaleString()}`;
}

  <p class="note" style="margin-top:6px">參考：別家的直立菜單卡，白底、藍字品項、紅字價格，一眼看得到份量和價錢。</p></div>`).join("")}
function material(){
  const rows=[...S.materials].sort((a,b)=>a.due.localeCompare(b.due)).map(m=>{const d=daysTo(m.due);const late=d<0&&m.status!=="已張貼";return `<tr><td><b>${esc(m.item)}</b></td><td>${esc(storeLabel(m.store))}</td><td>${esc(m.size)}</td><td>${esc(m.vendor)}</td><td class="tabnum">${fmtD(m.due)}${late?` <span class="pill p-bad">逾期</span>`:""}</td><td>${statusBtn("materials",m.id,m.status)}</td><td>${delBtn("materials",m.id)}</td></tr>`});
  return listModule("materials","物料","布條、海報、菜單牌、QR 立牌。從下單一路追到門市貼好。",rows,["品項","送到","尺寸","廠商","交期"],
   `<input id="m-item" name="item" placeholder="品項（例：牆面海報）" required><select id="m-store" name="store" required>${storeOpts}</select><input id="m-size" name="size" placeholder="尺寸"><input id="m-vendor" name="vendor" placeholder="廠商"><input id="m-due" name="due" type="date" required aria-label="交期">`);
}
function service(){
  const rows=[...S.service].reverse().map(x=>`<tr><td class="tabnum">${esc(x.date)}</td><td>${esc(storeLabel(x.store))}</td><td>${esc(x.msg)}</td><td>${statusBtn("service",x.id,x.status)}</td><td>${delBtn("service",x.id)}</td></tr>`);
  return listModule("service","客服紀錄","只記門市沒即時回覆的訊息。有紀錄，事後問起來查得到。",rows,["日期","門市","訊息摘要"],
   `<select id="s-store" name="store" required>${storeOpts}</select><input id="s-msg" name="msg" placeholder="顧客問了什麼" required>`);
}

function video(){
  const t=new Date(today()+"T00:00");const start=new Date(t);start.setDate(t.getDate()-t.getDay()+1);if(t.getDay()===0)start.setDate(start.getDate()-7);
  const weeks=[0,1].map(w=>[...Array(7)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+w*7+i);return iso(d)}));
  const posted=Object.values(S.videos).filter(x=>x.status==="已發").length;
  const day=d=>{const v=videoFor(d);const wd="日一二三四五六"[new Date(d+"T00:00").getDay()];return `<div class="day ${d===today()?"is-today":""}"><div class="d">週${wd}・${fmtD(d)}</div><div class="b">${esc(v.brand)}</div><div class="t">${esc(v.topic)}</div>${statusBtn("video",d,v.status)}</div>`};
  return `<section class="panel"><div><h2>短影音專區</h2><p class="hint">一天一支：7 個品牌剛好一週輪一輪。已發 ${posted} 支。點狀態切換：未拍 → 已拍 → 已剪 → 已發。</p></div>
   <div class="card"><h3>本週與下週</h3><div class="scroll"><div class="week">${weeks[0].map(day).join("")}</div></div>
   <div class="scroll" style="margin-top:8px"><div class="week">${weeks[1].map(day).join("")}</div></div></div>
   <div class="grid2">
    <div class="card"><h3>批次拍攝，不要每天拍</h3><ul class="today">
     <li><span class="pill p-tea">跑店日</span><span>同一區一次拍完：龍安（紅茶、拾串、少帥、煎餃）、寶山（滷味、拾串、炒泡麵）、中平（滷味）、壽昌（紅茶、豆腐鍋）</span></li>
     <li><span class="pill p-tea">每店</span><span>一次拍 4–6 段素材：製程、近鏡、上桌、門面、活動 POP</span></li>
     <li><span class="pill p-tea">發片</span><span>同一支片發 IG Reels、TikTok、YouTube Shorts，再用 LINE 推一次</span></li></ul></div>
    <div class="card"><h3>修改某一天的主題</h3><form class="add" data-form="videoEdit">
     <input id="v-date" name="date" type="date" required aria-label="日期"><select id="v-brand" name="brand">${brandOpts}</select><input id="v-topic" name="topic" placeholder="主題（例：開幕倒數）"><button class="btn" type="submit">更新</button></form>
     <p class="note" style="margin-top:8px">預設輪替：週一紅茶、週二滷味、週三麻辣拌、週四拾串關東煮、週五煎餃、週六豆腐鍋、週日炒泡麵。</p></div>
   </div></section>`;
}

function growth(){
  const lt=LINE_ACCS.map(k=>{const v=S.line[k]||{};const b=n(v.base),c=n(v.now);return {k,v,b,c,d:b&&c?c-b:null}});
  const tb=lt.reduce((a,x)=>a+x.b,0),tc=lt.reduce((a,x)=>a+(x.c||x.b),0);
  return `<section class="panel"><div><h2>成長</h2><p class="hint">兩個數字：營業額 +20%，以及 LINE 會員數。</p></div>
  <div class="card"><div class="brandhead" style="margin:0 0 6px"><h3>LINE 會員數</h3><span class="note">LINE@ 目的：增加會員數、推活動</span></div>
   <div class="scroll"><table><thead><tr><th>帳號</th><th class="c">起始好友</th><th class="c">目前好友</th><th class="c">增加</th></tr></thead><tbody>
   ${lt.map((x,i)=>`<tr><td>${esc(x.k)}</td><td class="c"><input id="lb-${i}" class="num-in" inputmode="numeric" placeholder="—" value="${esc(x.v.base)}" data-lb="${esc(x.k)}"></td><td class="c"><input id="ln-${i}" class="num-in" inputmode="numeric" placeholder="—" value="${esc(x.v.now)}" data-ln="${esc(x.k)}"></td><td class="c tabnum">${x.d==null?'<span class="note">—</span>':`<span class="pill ${x.d>0?"p-ok":"p-warn"}">${x.d>0?"+":""}${x.d}</span>`}</td></tr>`).join("")}
   </tbody><tfoot><tr><td>合計</td><td class="c">${tb||"—"}</td><td class="c">${tc||"—"}</td><td class="c">${tb&&tc?(tc-tb>0?"+":"")+(tc-tb):"—"}</td></tr></tfoot></table></div>
   <p class="note" style="margin-top:6px">每週看一次 LINE 後台的好友數填進「目前好友」。增加最快的方法：加好友送折價券＋桌上 QR 立牌。</p></div>
  <div class="card"><div class="brandhead" style="margin:0 0 6px"><h3>營業額</h3><span class="note">基準＝開始前一個月；每月月底填本月</span></div>
  <div class="scroll"><table><thead><tr><th>門市</th><th class="c">基準月</th><th class="c">本月</th><th class="c">成長</th></tr></thead><tbody>
  ${S.stores.map((s,i)=>{const b=n(s.base),c=n(s.now);const g=b&&c?(c/b-1)*100:null;const cls=g==null?"":g>=20?"p-ok":g>=0?"p-warn":"p-bad";
   return `<tr><td class="store-name"><b>${esc(s.brand)}</b><span>${esc(s.branch)}</span></td><td class="c"><input id="b-${i}" class="num-in" inputmode="numeric" placeholder="—" value="${esc(s.base)}" data-base="${i}"></td><td class="c"><input id="n-${i}" class="num-in" inputmode="numeric" placeholder="—" value="${esc(s.now)}" data-now="${i}"></td><td class="c">${g==null?'<span class="note">—</span>':`<span class="pill ${cls}">${(g>=0?"+":"")+g.toFixed(1)}%</span>`}</td></tr>`}).join("")}
  </tbody></table></div></div>
  </section>`;
}

function vault(){
  return `<div class="grid3">${[["Google 商家",`<a class="lnk" href="${LINKS.gbp}" target="_blank" rel="noopener">business.google.com/locations</a>`,"全部門市清單；看不到就切「要求桌面版網站」"],["LINE 官方帳號",`<a class="lnk" href="${LINKS.line}" target="_blank" rel="noopener">manager.line.biz</a>`,"各店 OA 後台"],["肚肚後台（雲端點餐）",`<a class="lnk" href="${LINKS.dudoo}" target="_blank" rel="noopener">admin.dudooeat.com</a>`,"O2O 管理 → 線上點餐設定。帳密放密碼管理器"],["LINE Pay QR Code","老闆提供檔案","獨資 5 間：紅茶 3、拾串 1、煎餃 1"],["店長 曹大哥","已加 LINE","門市聯絡不到時通報"],["印刷廠商","待確認","布條、海報、菜單牌、立牌"]].map(([a,b,c])=>`<div class="card"><h3>${a}</h3><div class="tabnum" style="font-size:.85rem">${b}</div><p class="note">${c}</p></div>`).join("")}</div>
  <p class="note">密碼不要寫在這裡，放 iPad「密碼」App 或密碼管理器。</p>`;
}
function backup(){
  return `<div class="card"><h3>匯出</h3><p class="note">資料存在這台裝置的瀏覽器裡。換裝置、換網址前，先複製這段備份碼，貼到新的地方「匯入」。</p>
   <textarea id="bk-out" readonly style="width:100%;min-height:90px;font-size:.75rem">${esc(JSON.stringify(S))}</textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn" id="bkCopy">複製備份碼</button><span id="bkOk" class="note"></span></div></div>
  <div class="card"><h3>匯入</h3><p class="note">貼上備份碼後按匯入，會取代這台裝置目前的資料。</p>
   <textarea id="bk-in" style="width:100%;min-height:90px;font-size:.75rem" placeholder="貼上備份碼"></textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn" id="bkImport">匯入</button><span id="bkMsg" class="note"></span></div></div>
  <div class="card"><h3>重設</h3><button class="btn ghost" id="reset">清空並回到預設資料</button> <span id="resetConfirm"></span></div>`;
}
function more(){
  const opts=[["meeting","開會紀錄"],["service","客服紀錄"],["vault","帳號連結"],["backup","備份"]];
  const seg=`<div class="seg" role="group" aria-label="切換">${opts.map(([k,l])=>`<button data-mv="${k}" aria-pressed="${moreView===k}">${l}</button>`).join("")}</div>`;
  const body=moreView==="meeting"?meeting():moreView==="service"?service():moreView==="vault"?`<section class="panel"><div><h2>帳號連結</h2></div>${vault()}</section>`:`<section class="panel"><div><h2>備份</h2></div>${backup()}</section>`;
  return `<div style="margin-top:20px">${seg}</div>${body}`;
}

const VIEWS={home,stores,campaign,material,video,growth,more};
function render(){$("#main").innerHTML=VIEWS[tab]();bind()}
function bind(){
  document.querySelectorAll(".cell[data-k]").forEach(b=>b.onclick=()=>{const s=S.stores[b.dataset.i];s.st[b.dataset.k]=((s.st[b.dataset.k]||0)+1)%4;save();render()});
  document.querySelectorAll("[data-ask]").forEach(i=>i.onchange=()=>{S.stores[i.dataset.ask].ask=i.value.trim();save();render()});
  document.querySelectorAll("[data-cid]").forEach(b=>b.onclick=()=>{const c=S.campaigns.find(x=>String(x.id)===b.dataset.cid);c.exclude=c.exclude||[];const k=b.dataset.sid;c.exclude=c.exclude.includes(k)?c.exclude.filter(x=>x!==k):[...c.exclude,k];save();render()});
  document.querySelectorAll("[data-tweak]").forEach(i=>i.onchange=()=>{S.campaigns.find(x=>String(x.id)===i.dataset.tweak).tweak=i.value.trim();save()});
  document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{const c=S.campaigns.find(x=>String(x.id)===b.dataset.dup);S.campaigns.push({...c,id:Date.now(),title:c.title+"（複製）",status:"規劃中",exclude:[...(c.exclude||[])]});save();render()});
  document.querySelectorAll("[data-ag]").forEach(c=>c.onchange=()=>{const k=c.dataset.ag;S.meeting[k]={...(S.meeting[k]||{}),done:c.checked};save();render()});
  document.querySelectorAll("[data-agn]").forEach(t=>t.onchange=()=>{const k=t.dataset.agn;S.meeting[k]={...(S.meeting[k]||{}),note:t.value};save()});
  const ax=document.querySelector("[data-agx]");if(ax)ax.onchange=()=>{S.meeting._extra=ax.value;save()};
  const ar=$("#agReset");if(ar)ar.onclick=()=>{$("#agConfirm").innerHTML=`確定清空？ <button class="btn ghost" id="agYes">確定</button>`;$("#agYes").onclick=()=>{S.meeting={};save();render()}};
  document.querySelectorAll("[data-mo]").forEach(c=>c.onchange=()=>{monthState(ym()).order[c.dataset.mo]=c.checked;save();render()});
  document.querySelectorAll("[data-mp]").forEach(c=>c.onchange=()=>{monthState(nextYm()).push[c.dataset.mp]=c.checked;save();render()});
  const rm=$("#rt-msg");if(rm)rm.onchange=()=>{monthState(nextYm()).msg=rm.value;save()};
  const cm=$("#copyMsg");if(cm)cm.onclick=()=>{const t=$("#rt-msg").value;navigator.clipboard.writeText(t).then(()=>{$("#copyOk").textContent="已複製"},()=>{$("#rt-msg").select();$("#copyOk").textContent="已選取，請長按複製"})};
  const rs=$("#resetMsg");if(rs)rs.onclick=()=>{delete monthState(nextYm()).msg;save();render()};
  document.querySelectorAll("[data-mplan]").forEach(i=>i.onchange=()=>{monthState(i.dataset.mplan).plan=i.value.trim();save()});
  document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{storeView=b.dataset.sv;try{localStorage.setItem(KEY+"-sv",storeView)}catch(e){}render()});
  document.querySelectorAll("[data-ti]").forEach(c=>c.onchange=()=>{S.stores[c.dataset.ti].todos[c.dataset.tj].done=c.checked;save();render()});
  document.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{S.stores[b.dataset.tdel].todos.splice(b.dataset.tj,1);save();render()});
  document.querySelectorAll("[data-lb]").forEach(i=>i.onchange=()=>{(S.line[i.dataset.lb]=S.line[i.dataset.lb]||{}).base=i.value.trim();save();render()});
  document.querySelectorAll("[data-ln]").forEach(i=>i.onchange=()=>{(S.line[i.dataset.ln]=S.line[i.dataset.ln]||{}).now=i.value.trim();save();render()});
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{moreView=b.dataset.mv;try{localStorage.setItem(KEY+"-mv",moreView)}catch(e){}render()});
  const bc=$("#bkCopy");if(bc)bc.onclick=()=>{const t=$("#bk-out").value;navigator.clipboard.writeText(t).then(()=>{$("#bkOk").textContent="已複製"},()=>{$("#bk-out").select();$("#bkOk").textContent="已選取，請長按複製"})};
  const bi=$("#bkImport");if(bi)bi.onclick=()=>{try{const d=JSON.parse($("#bk-in").value);if(!d.stores)throw 0;S=d;save();$("#bkMsg").textContent="已匯入";render()}catch(e){$("#bkMsg").textContent="備份碼格式不對，請重新複製完整的一段"}};
  document.querySelectorAll("[data-base]").forEach(i=>i.onchange=()=>{S.stores[i.dataset.base].base=i.value.trim();save();render()});
  document.querySelectorAll("[data-now]").forEach(i=>i.onchange=()=>{S.stores[i.dataset.now].now=i.value.trim();save();render()});
  document.querySelectorAll(".status").forEach(b=>b.onclick=()=>{const {type,id}=b.dataset;
    if(type==="video"){const v=videoFor(id);S.videos[id]={...(S.videos[id]||{}),status:next("video",v.status)}}
    else{const it=S[type].find(x=>String(x.id)===id);it.status=next(type==="campaigns"?"campaign":type==="materials"?"material":"service",it.status)}
    save();render()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S[b.dataset.del]=S[b.dataset.del].filter(x=>String(x.id)!==b.dataset.id);save();render()});
  document.querySelectorAll("form[data-form]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const id=Date.now();
    if(f.dataset.form==="campaigns")S.campaigns.push({id,...d,status:"規劃中"});
    if(f.dataset.form==="materials")S.materials.push({id,...d,status:"待下單"});
    if(f.dataset.form==="service")S.service.push({id,...d,date:today(),status:"待門市回覆"});
    if(f.dataset.form==="todo"){const t={cat:d.cat,text:d.text,done:false};(d.store==="all"?S.stores:[S.stores[d.store]]).forEach(s=>s.todos.push({...t}))}
    if(f.dataset.form==="videoEdit"){const cur=S.videos[d.date]||{};S.videos[d.date]={...cur,...(d.brand&&d.brand!=="全品牌"?{brand:d.brand}:{}),...(d.topic?{topic:d.topic}:{})}}
    save();render()});
  const r=$("#reset");if(r)r.onclick=()=>{$("#resetConfirm").innerHTML=`確定清空？ <button class="btn ghost" id="yes">確定</button>`;$("#yes").onclick=()=>{S=seed();save();render()}};
}
renderTabs();render();renderGoal();
</script>

</body>
</html>
