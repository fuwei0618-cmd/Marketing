<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DM 列印</title>
<style>
:root{--bg:#f3f4f2;--ink:#16416c}
html,body{margin:0;background:var(--bg);font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid #dde3ea}
.bar b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{display:flex;gap:8px}
button,a.btn{font:inherit;font-size:15px;border-radius:999px;padding:8px 18px;border:1px solid var(--ink);background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}
button.pri{background:var(--ink);color:#fff}
.wrap{display:flex;justify-content:center;padding:16px}
img{max-width:min(100%,640px);height:auto;box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff}
@page{size:A4 portrait;margin:8mm}
@media print{.bar{display:none}html,body{background:#fff;height:auto;overflow:hidden}.wrap{padding:0;display:block}img{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:270mm;box-shadow:none;page-break-inside:avoid;break-inside:avoid}}
</style></head><body>
<div class="bar"><a class="btn" href="index.html?v=goal" id="back" onclick="if(history.length>1&&document.referrer){history.back();return false}">← 上一頁</a><b id="t">DM</b><div><button id="dl">下載</button><button class="pri" onclick="print()">列印 A4</button></div></div>
<div class="wrap"><img id="im" alt=""></div>
<script>
const q=new URLSearchParams(location.search),f=q.get("f")||"";
if(/^(dm|assets|img)\/[\w.\-\/]+$/.test(f)){document.getElementById("im").src=f}
const n=q.get("n");if(n){document.getElementById("t").textContent=n;document.title=n}

document.getElementById("dl").onclick=async()=>{try{const r=await fetch(f);const bl=await r.blob();const name=(n||f.split("/").pop().replace(/\.\w+$/,""))+"."+(f.split(".").pop());
 const file=new File([bl],name,{type:bl.type||"image/png"});
 if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&"ontouchend" in document){await navigator.share({files:[file]});return}
 const u=URL.createObjectURL(bl);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){if(e&&e.name!=="AbortError")alert("下載失敗，請長按圖片儲存")}};
</script></body></html>
